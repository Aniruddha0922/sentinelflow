name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check Python style
        run: |
          python -m ruff check backend scripts
          python -m ruff format --check backend scripts
      - name: Run backend tests with coverage
        run: python -m pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test
      - name: Build frontend
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install integration test dependencies
        working-directory: .
        run: python -m pip install -r backend/requirements.txt playwright==1.63.0
      - name: Install headless browser
        run: python -m playwright install --with-deps chromium
      - name: Exercise the built app in a real browser
        working-directory: .
        run: python scripts/smoke_browser.py --screenshot browser-artifacts/dashboard.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
